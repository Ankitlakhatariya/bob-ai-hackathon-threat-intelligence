#   - Use double quotes around all string values
# =============================================================================

team:
  name: "threat-intelligence"          # REQUIRED — e.g., "Orion Squad"
  track: "AI"                           # REQUIRED — one of: AI | DevOps | Sustainability | Open
  lead:
    name: "Ayush5112006"                # REQUIRED — e.g., "Alice Chen"
    email: "thummarayush05@gmail.com"   # REQUIRED — e.g., "alice.chen@ibm.com"
  members:
    - name: ""                         # REQUIRED — Team member 1
      email: ""
    - name: ""                         # Add more members by copying the two lines above
      email: ""
    - name: ""
      email: ""

submission:
  title: "ThreatLens"                  # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Security teams need to correlate alerts, incidents, and threat intelligence across a growing set of signals.
    Analysts lose time switching between views and manually prioritizing the events that need attention.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    ThreatLens is a focused React dashboard for exploring alerts, incidents, MITRE ATT&CK context, analyst briefs,
    and risk analytics in one workflow. Mock threat data and reusable visual components demonstrate the analyst experience.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Alert triage with severity and status filtering"
    - "Incident investigation with relationship visualization"
    - "MITRE ATT&CK technique exploration"
    - "Analyst briefs and trend analytics"
    - "Light and dark theme support"

  tech_stack:
    languages: ["TypeScript"]         # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["React", "Vite"]     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]      # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Recharts", "GitHub Actions"] # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The strongest part is the cohesive analyst workflow: dashboards, alert details, incidents, MITRE context,
    briefs, and analytics share one visual language and support a realistic demo flow.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The current prototype uses mock data and does not yet connect to a production threat-intelligence feed,
    persistent database, authentication provider, or hosted AI inference service.

